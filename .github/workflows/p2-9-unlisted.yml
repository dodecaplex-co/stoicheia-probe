name: d-probes-2 P2-9 unlisted

# d-probes-2, P2-9: a GitHub-owned action that is not on the allow-list (edition-actions allows no GitHub-owned action
# it does not name). GitHub must refuse it. If it ran anyway, it would only set up Python.
on:
  push:
    branches: [probe2/attest]

permissions:
  contents: read

jobs:
  unlisted:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0, not on the list
        with:
          python-version: '3.12'
